<style>
:root {
    --bg-main: #040c14;
    --bg-card: rgba(13, 27, 42, 0.70);
    --luxury-gold: #E2B744;
    --ambient-blue: rgba(20, 45, 76, 0.55);
    --glow-gold: rgba(226, 183, 68, 0.3);
    --text-white: #f8fafc;
    --text-muted: #94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg-main);color:var(--text-white);overflow-x:hidden;position:relative;}

/* VISIBLE FLOATING AMBIENT ORBS (BACKGROUND EFFECT) */
.ambient-orbs {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.22;
    animation: floatOrb 12s infinite alternate ease-in-out;
}
.orb-1 {
    width: 400px; height: 400px;
    background: var(--luxury-gold);
    top: 5%; left: 10%;
}
.orb-2 {
    width: 500px; height: 500px;
    background: #1d4ed8;
    bottom: 10%; right: 10%;
    animation-delay: -4s;
}
@keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(60px, 60px) scale(1.15); }
}

nav{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:24px 8%;background:rgba(4, 12, 20, 0.90);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.03);z-index:999}
nav .brand{font-family:'Playfair Display',serif;font-size:22px;color:var(--luxury-gold);font-weight:600;letter-spacing:0.5px}
nav .links a{color:#fff;text-decoration:none;margin-left:28px;font-size:13px;font-weight:500;transition:color 0.3s}
nav .links a:hover, nav .links a.active{color:var(--luxury-gold)}

.quote-btn{background:linear-gradient(135deg, #E2B744, #C19932);color:#040c14!important;padding:12px 24px;border-radius:4px;font-weight:600;text-decoration:none;transition:transform 0.3s ease, box-shadow 0.3s ease;font-size:13px}
.quote-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(226, 183, 68, 0.4);}

.hero{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:160px 20px 80px;background: radial-gradient(circle at 50% 40%, rgba(4, 12, 20, 0.35) 0%, rgba(4, 12, 20, 0.75) 75%);box-shadow: inset 0 0 120px rgba(4, 12, 20, 0.9);z-index: 2;}
.hero::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;animation:heroSlider 24s infinite;z-index:-2;filter: brightness(0.48) contrast(1.02) saturate(0.9);}

@keyframes heroSlider{
    0%,23%{background-image:url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=1920');}
    25%,48%{background-image:url('https://images.unsplash.com/photo-1578575437130-527eed3abbec?q=80&w=1920');}
    50%,73%{background-image:url('https://images.unsplash.com/photo-1565891741441-64926e441838?q=80&w=1920');}
    75%,100%{background-image:url('https://images.unsplash.com/photo-1519003722824-194d4455a60c?q=80&w=1920');}
}

.logo{width:140px;margin-bottom:20px;animation:floatLogo 4s ease-in-out infinite}
@keyframes floatLogo{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

.company{font-family:'Playfair Display',serif;font-size:68px;color:var(--luxury-gold);font-weight:500;line-height:1.1;letter-spacing:-0.5px}
.private{letter-spacing:10px;color:var(--text-muted);font-size:13px;margin-top:8px;font-weight:600}
.tagline{font-size:26px;margin-top:25px;color:#f1f5f9;font-weight:400}
.sub{max-width:780px;margin:15px auto 35px;color:var(--text-muted);font-size:15px;line-height:1.6}
.badges{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.badge{background:rgba(255,255,255,0.04);padding:6px 16px;border-radius:4px;border:1px solid rgba(255,255,255,0.06);font-size:12px;color:var(--luxury-gold);font-weight:500;transition:0.3s;}
.badge:hover{background:rgba(226,183,68,0.08); border-color:var(--luxury-gold);}

section{padding:100px 8%; position: relative; z-index: 2;}
.title-area{text-align:center;margin-bottom:65px}
.title-area h2{font-family:'Playfair Display',serif;font-size:42px;color:#fff;font-weight:500}
.title-area h2 span{color:var(--luxury-gold)}
.title-area p{color:var(--text-muted);font-size:15px;margin-top:6px}

/* VISIBLE 3D TILT & GOLDEN SHIMMER LIGHT SWEEP ON CARDS */
.tilt-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(226, 183, 68, 0.25);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    transform-style: preserve-3d;
    transform: perspective(1000px);
    transition: border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.tilt-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(226, 183, 68, 0.35), transparent);
    transition: 0.6s ease;
}
.tilt-card:hover::before {
    left: 100%;
}
.tilt-card:hover {
    border-color: var(--luxury-gold);
    box-shadow: 0 20px 45px rgba(226, 183, 68, 0.35);
}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:30px}
.stat-card{padding:40px 25px;text-align:center;}
.stat-card h2{font-family:'Playfair Display',serif;font-size:46px;color:var(--luxury-gold);margin-bottom:5px;font-weight:500}
.stat-card p{color:var(--text-muted);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:1px}

/* GLOBAL REACH COUNTER SECTION */
.global-reach-section { background: linear-gradient(135deg, #03080f, #071626); border-top: 1px solid rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.02); }
.global-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 30px; }
.global-card { padding: 40px 25px; text-align: center; }
.global-card h3 { font-family: 'Playfair Display', serif; font-size: 46px; color: var(--luxury-gold); margin-bottom: 5px; font-weight: 500; }
.global-card p { color: var(--text-muted); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

.texture-section{background:linear-gradient(rgba(4,12,20,.9),rgba(4,12,20,.95)), url('https://images.unsplash.com/photo-1552664730-d307ca884978?q=80&w=2000');background-size:cover;background-position:center;background-attachment:fixed;}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px}
.feature-card{padding:35px;}
.feature-card h3{color:var(--luxury-gold);font-size:20px;margin-bottom:12px;font-family:'Playfair Display',serif;font-weight:500}
.feature-card p{color:var(--text-muted);font-size:14px;line-height:1.65}

.partner-wrap{padding:60px 0;overflow:hidden;background:#03090f;border-top:1px solid rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.02)}
.logo-track{display:flex;align-items:center;gap:60px;width:max-content;animation:scrollLogos 30s linear infinite;}
.logo-track img{height:75px;width:auto;background:rgba(255,255,255,0.96);padding:14px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.3);filter: grayscale(1) contrast(1.2); opacity:0.45; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); object-fit: contain;}
.logo-track img:hover{transform:scale(1.08); filter: grayscale(0) contrast(1); opacity:1; box-shadow:0 8px 25px rgba(226,183,68,0.35);}
@keyframes scrollLogos{ 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

.review-section{background:linear-gradient(180deg, #040c14, #061524); overflow:hidden;}
.review-slider-wrap {width: 100%; overflow: hidden; padding: 25px 0;}
.review-track-auto {display: flex; gap: 30px; width: max-content; animation: loopReviews 45s linear infinite;}
.review-track-auto:hover {animation-play-state: paused;}
.luxury-review-box{width: 360px; padding:35px; flex-shrink: 0;}
.luxury-review-box h4{color:#fff;font-size:16px;margin-bottom:4px;font-weight:600}
.luxury-review-box .stars{color:var(--luxury-gold);margin-bottom:15px;font-size:11px;letter-spacing:1px}
.luxury-review-box p{color:var(--text-muted);font-size:14px;line-height:1.6;font-style:italic}
@keyframes loopReviews { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

.partner-wrap-client{padding:60px 0;overflow:hidden;background:#02070e}

/* Contact Section Alignment */
.contact-section-base{background:var(--bg-main); padding:60px 8%; border-top:1px solid rgba(255,255,255,0.02);}
.contact-grid-base{display:grid; grid-template-columns: 1fr 1fr 1fr; gap:40px; max-width:1300px; margin:0 auto; align-items: start;}
.contact-col-base:nth-child(1){text-align:left;}
.contact-col-base:nth-child(2){text-align:center;}
.contact-col-base:nth-child(3){text-align:right;}
.contact-col-base h3{font-family:'Playfair Display',serif; color:var(--luxury-gold); font-size:18px; margin-bottom:15px; font-weight:500;}
.contact-col-base p{color:var(--text-white); font-size:14px; line-height:1.6; margin-bottom:6px;}

/* MOBILE RESPONSIVENESS FIX */
@media (max-width: 768px) {
    .nav .links { display: none; }
    .company { font-size: 40px !important; }
    .feature-grid, .contact-grid-base { grid-template-columns: 1fr !important; gap: 30px !important; }
    .contact-col-base { text-align: center !important; }
}

.quote-popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(4,12,20,0.9);backdrop-filter:blur(15px);z-index:9999;justify-content:center;align-items:center;padding:20px}
.quote-box{width:100%;max-width:540px;background:#081420;border:1px solid rgba(226,183,68,0.25);border-radius:4px;padding:45px;position:relative;box-shadow:0 30px 60px rgba(0,0,0,0.5)}
.quote-box h2{font-family:'Playfair Display',serif;color:var(--luxury-gold);font-size:32px;margin-bottom:25px;text-align:center;font-weight:500}
.quote-box form{display:flex;flex-direction:column;gap:16px}
.quote-box input, .quote-box select, .quote-box textarea{background:var(--bg-main);border:1px solid rgba(255,255,255,0.04);color:#fff;padding:15px;border-radius:2px;font-size:14px;outline:none;transition:0.3s;font-family:inherit;}
.quote-box input:focus, .quote-box select:focus, .quote-box textarea:focus{border-color:var(--luxury-gold)}
.quote-box button{background:var(--luxury-gold);color:#040c14;font-weight:600;border:none;padding:16px;cursor:pointer;font-size:14px;transition:0.3s;border-radius:2px;}
.quote-box button:hover{background:#fff}
.close-popup{position:absolute;top:18px;right:22px;font-size:34px;cursor:pointer;color:var(--luxury-gold)}

/* ANIMATED WHATSAPP BUTTON PLACED ON BOTTOM-LEFT */
.whatsapp{
    position: fixed;
    left: 25px;
    bottom: 25px;
    background: #25D366;
